<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-label="Agent HUD 视频视觉示意：点阵矩阵、全息面板与数据流纸飞机">
  <defs>
    <linearGradient id="warn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8bd18a"/>
      <stop offset="0.52" stop-color="#d9c26a"/>
      <stop offset="1" stop-color="#e56a5a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b2428" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#14191b" stop-opacity="0.96"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#7fb6d9" opacity="0.2"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7fb6d9" opacity="0.75"/>
    </marker>
  </defs>

  <rect width="720" height="460" fill="#111312"/>
  <rect width="720" height="460" fill="url(#dots)"/>

  <!-- 配额面板 -->
  <rect x="52" y="64" width="304" height="190" rx="14" fill="url(#panel)" stroke="#7fb6d9" stroke-opacity="0.5"/>
  <text x="76" y="98" fill="#d8d4cb" font-family="sans-serif" font-size="13" letter-spacing="2.4">API QUOTA</text>
  <circle cx="120" cy="158" r="34" fill="none" stroke="#2b3a42" stroke-width="8"/>
  <circle cx="120" cy="158" r="34" fill="none" stroke="#ff5a2b" stroke-width="8" stroke-linecap="round"
          stroke-dasharray="150 214" transform="rotate(-90 120 158)"/>
  <text x="120" y="164" fill="#f1eee7" font-family="sans-serif" font-size="15" text-anchor="middle">68%</text>
  <g font-family="sans-serif" font-size="11" fill="#8c8b83">
    <text x="184" y="132">REQUESTS</text>
    <rect x="184" y="140" width="148" height="6" rx="3" fill="#2b3a42"/>
    <rect x="184" y="140" width="104" height="6" rx="3" fill="#7fb6d9"/>
    <text x="184" y="168">LATENCY</text>
    <rect x="184" y="176" width="148" height="6" rx="3" fill="#2b3a42"/>
    <rect x="184" y="176" width="62" height="6" rx="3" fill="#8bd18a"/>
    <text x="184" y="204">ERRORS</text>
    <rect x="184" y="212" width="148" height="6" rx="3" fill="#2b3a42"/>
    <rect x="184" y="212" width="24" height="6" rx="3" fill="#e56a5a"/>
  </g>

  <!-- 审批流面板 -->
  <rect x="382" y="52" width="286" height="146" rx="14" fill="url(#panel)" stroke="#7fb6d9" stroke-opacity="0.5"/>
  <text x="406" y="84" fill="#d8d4cb" font-family="sans-serif" font-size="13" letter-spacing="2.4">APPROVAL FLOW</text>
  <g font-family="sans-serif" font-size="10.5" text-anchor="middle">
    <rect x="406" y="106" width="68" height="36" rx="8" fill="#222c30" stroke="#7fb6d9" stroke-opacity="0.5"/>
    <text x="440" y="128" fill="#d8d4cb">REVIEW</text>
    <path d="M 482 124 L 506 124" stroke="#7fb6d9" stroke-opacity="0.75" marker-end="url(#arrow)"/>
    <rect x="514" y="106" width="68" height="36" rx="8" fill="#222c30" stroke="#7fb6d9" stroke-opacity="0.5"/>
    <text x="548" y="128" fill="#d8d4cb">PATCH</text>
    <path d="M 590 124 L 614 124" stroke="#7fb6d9" stroke-opacity="0.75" marker-end="url(#arrow)"/>
    <rect x="622" y="106" width="30" height="36" rx="8" fill="#ff5a2b" fill-opacity="0.16" stroke="#ff5a2b" stroke-opacity="0.7"/>
    <text x="637" y="128" fill="#ff5a2b">LIVE</text>
  </g>
  <path d="M 406 162 L 652 162" stroke="#7fb6d9" stroke-opacity="0.16"/>
  <text x="406" y="181" fill="#8c8b83" font-family="sans-serif" font-size="10.5">WAITING → CHANGED → SHIPPED</text>

  <!-- 定价页面板 -->
  <rect x="382" y="220" width="286" height="146" rx="14" fill="url(#panel)" stroke="#7fb6d9" stroke-opacity="0.5"/>
  <text x="406" y="252" fill="#d8d4cb" font-family="sans-serif" font-size="13" letter-spacing="2.4">PRICING PAGE</text>
  <g stroke="#7fb6d9" stroke-opacity="0.28">
    <path d="M 406 270 L 560 270"/>
    <path d="M 406 290 L 560 290"/>
    <path d="M 406 310 L 560 310"/>
  </g>
  <g fill="#8c8b83" font-family="sans-serif" font-size="10.5">
    <text x="406" y="266">STARTER</text>
    <text x="406" y="286">PRO</text>
    <text x="406" y="306">TEAM</text>
  </g>
  <rect x="576" y="262" width="70" height="58" rx="10" fill="#ff5a2b" fill-opacity="0.12" stroke="#ff5a2b" stroke-opacity="0.6"/>
  <text x="611" y="296" fill="#ff5a2b" font-family="sans-serif" font-size="18" text-anchor="middle">¥299</text>

  <!-- 数据流纸飞机 -->
  <g opacity="0.9">
    <path d="M 96 316 C 220 268, 316 292, 430 226" fill="none" stroke="#7fb6d9" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="6 7"/>
    <path d="M 430 196 l 30 10 -22 9 5 13 -8 -11 -12 6 8 -13 z" fill="#ff5a2b"/>
    <path d="M 208 346 C 322 322, 420 340, 520 296" fill="none" stroke="#7fb6d9" stroke-opacity="0.35" stroke-width="1.2" stroke-dasharray="5 8"/>
    <path d="M 520 272 l 24 8 -18 7 4 10 -7 -9 -10 5 7 -10 z" fill="#7fb6d9"/>
  </g>

  <!-- 状态渐变与品牌 -->
  <text x="52" y="400" fill="#8c8b83" font-family="sans-serif" font-size="10.5" letter-spacing="1.8">STATUS</text>
  <rect x="52" y="410" width="616" height="6" rx="3" fill="url(#warn)"/>
  <text x="668" y="400" fill="#f1eee7" font-family="sans-serif" font-size="14" letter-spacing="3" text-anchor="end">AGENT HUD</text>
</svg>
